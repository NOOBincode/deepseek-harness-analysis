  <text x="2060.0774999999994" y="119.35000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">通知按状态注入或新开 turn</text>
</g>
<g class="node" data-id="M" data-label="停因不是 completed 就转成错误结果" data-shape="rectangle">
  <rect x="1525.231" y="222.70000000000002" width="268.69599999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1659.579" y="241.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">停因不是 completed 就转成错误结果</text>
</g>
<g class="node" data-id="N" data-label="释放子 Agent" data-shape="rectangle">
  <rect x="1852.301" y="161.8" width="122.71900000000001" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1913.6605" y="180.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">释放子 Agent</text>
</g>
</svg>