<polyline class="edge" data-from="F" data-to="G" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1307.541,149.8 1347.5409999999997,149.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="G" data-to="H" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1493.2309999999998,149.8 1509.2309999999998,149.8 1509.2309999999998,58.45 1525.231,58.45" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="G" data-to="I" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1493.2309999999998,149.8 1509.2309999999998,149.8 1509.2309999999998,119.35000000000001 1525.231,119.35000000000001" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="G" data-to="J" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1493.2309999999998,149.8 1509.2309999999998,149.8 1509.2309999999998,180.25 1525.231,180.25" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="I" data-to="K" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1688.705,119.35000000000001 1736.7049999999997,119.35000000000001" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="K" data-to="L" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1912.0349999999996,119.35000000000001 1952.0349999999996,119.35000000000001" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="G" data-to="M" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1493.2309999999998,149.8 1509.2309999999998,149.8 1509.2309999999998,241.15000000000003 1525.231,241.15000000000003" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="J" data-to="N" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1804.301,180.25 1852.301,180.25" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="A" data-label="父 Agent 发出委派" data-shape="rectangle">
  <rect x="40" y="131.35000000000002" width="154.582" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="117.291" y="149.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">父 Agent 发出委派</text>
