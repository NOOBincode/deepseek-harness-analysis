  <rect x="677.098" y="131.35000000000002" width="175.32999999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="764.7629999999999" y="149.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">校验它声明过的能力</text>
</g>
<g class="node" data-id="E" data-label="创建真子 Agent" data-shape="rectangle">
  <rect x="892.4279999999999" y="131.35000000000002" width="137.539" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="961.1974999999999" y="149.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">创建真子 Agent</text>
</g>
<g class="node" data-id="F" data-label="子 Agent 在自己的 Session 里跑" data-shape="rectangle">
  <rect x="1069.9669999999999" y="131.35000000000002" width="237.57399999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1188.754" y="149.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">子 Agent 在自己的 Session 里跑</text>
</g>
<g class="node" data-id="G" data-label="读回输出与停因" data-shape="rectangle">
  <rect x="1347.5409999999997" y="131.35000000000002" width="145.69" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1420.3859999999997" y="149.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">读回输出与停因</text>
</g>
<g class="node" data-id="H" data-label="前台:直接当成工具结果" data-shape="rectangle">
  <rect x="1525.231" y="40" width="193.11399999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1621.788" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">前台:直接当成工具结果</text>
</g>
<g class="node" data-id="I" data-label="后台:包成一条作业" data-shape="rectangle">
  <rect x="1525.231" y="100.9" width="163.474" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1606.968" y="119.35000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">后台:包成一条作业</text>
</g>
<g class="node" data-id="J" data-label="续存:子 Agent 常驻,之后还能再发消息" data-shape="rectangle">
  <rect x="1525.231" y="161.8" width="279.06999999999994" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1664.766" y="180.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">续存:子 Agent 常驻,之后还能再发消息</text>
</g>
<g class="node" data-id="K" data-label="作业完成发一条通知" data-shape="rectangle">
  <rect x="1736.7049999999997" y="100.9" width="175.32999999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1824.3699999999997" y="119.35000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">作业完成发一条通知</text>
</g>
<g class="node" data-id="L" data-label="通知按状态注入或新开 turn" data-shape="rectangle">
