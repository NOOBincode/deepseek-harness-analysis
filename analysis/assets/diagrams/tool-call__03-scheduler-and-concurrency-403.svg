</g>
<g class="message" data-from="G" data-to="R" data-label="finalize(#0)         %% 跑 post-execute" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="253.564" y1="560" x2="393.56399999999996" y2="560" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="323.56399999999996" y="550" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">finalize(#0)         %% 跑 post-execute</text>
</g>
