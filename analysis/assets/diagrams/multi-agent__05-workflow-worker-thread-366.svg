<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 537.502 852" width="537.502" height="852" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<g class="block" data-type="alt" data-label="可以起">
  <rect x="30" y="188" width="477.50199999999995" height="354" rx="0" ry="0" fill="none" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="30" y="188" width="77.71" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="36" y="197" font-size="11" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">alt [可以起]</text>
  <line x1="30" y1="494" x2="507.50199999999995" y2="494" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
  <text x="38" y="508" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">[不能起]</text>
</g>
<line class="lifeline" data-actor="W" x1="110.327" y1="70" x2="110.327" y2="822" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="H" x1="271.3445" y1="70" x2="271.3445" y2="822" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="S" x1="429.76849999999996" y1="70" x2="429.76849999999996" y2="822" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="W" data-to="H" data-label="起一个子 Agent" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="110.327" y1="90" x2="271.3445" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="190.83575" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">起一个子 Agent</text>
</g>
<g class="message" data-from="H" data-to="H" data-label="准入检查 —— 已取消或已终局就拒绝" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="271.3445,130 301.3445,130 301.3445,150 271.3445,150" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="309.3445" y="140" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">准入检查 —— 已取消或已终局就拒绝</text>
</g>
<g class="message" data-from="H" data-to="S" data-label="用 provider 起子 Agent" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="271.3445" y1="228" x2="429.76849999999996" y2="228" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="350.55649999999997" y="218" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">用 provider 起子 Agent</text>
</g>
<g class="message" data-from="S" data-to="H" data-label="子 Agent 已发布" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="429.76849999999996" y1="268" x2="271.3445" y2="268" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="350.55649999999997" y="258" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">子 Agent 已发布</text>
</g>
<g class="message" data-from="H" data-to="W" data-label="子 Agent 句柄已就绪" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="271.3445" y1="308" x2="110.327" y2="308" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="190.83575" y="298" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">子 Agent 句柄已就绪</text>
</g>
<g class="message" data-from="S" data-to="H" data-label="跑完并带回结果" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="429.76849999999996" y1="348" x2="271.3445" y2="348" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="350.55649999999997" y="338" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">跑完并带回结果</text>
</g>
<g class="message" data-from="H" data-to="H" data-label="结果快照成纯 JSON" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="271.3445,388 301.3445,388 301.3445,408 271.3445,408" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="309.3445" y="398" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">结果快照成纯 JSON</text>
</g>
<g class="message" data-from="H" data-to="W" data-label="结果" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="271.3445" y1="458" x2="110.327" y2="458" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="190.83575" y="448" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">结果</text>
</g>
<g class="message" data-from="H" data-to="W" data-label="启动失败" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="271.3445" y1="522" x2="110.327" y2="522" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="190.83575" y="512" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">启动失败</text>
</g>
<g class="message" data-from="W" data-to="H" data-label="释放这个子 Agent" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="110.327" y1="562" x2="271.3445" y2="562" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="190.83575" y="552" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">释放这个子 Agent</text>
</g>
<g class="message" data-from="H" data-to="H" data-label="按请求编号记忆化释放" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="271.3445,602 301.3445,602 301.3445,622 271.3445,622" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="309.3445" y="612" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">按请求编号记忆化释放</text>
</g>
<g class="message" data-from="H" data-to="W" data-label="释放确认" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="271.3445" y1="672" x2="110.327" y2="672" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="190.83575" y="662" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">释放确认</text>
</g>
<g class="message" data-from="W" data-to="H" data-label="脚本结束并交回最终结果" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="110.327" y1="712" x2="271.3445" y2="712" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="190.83575" y="702" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">脚本结束并交回最终结果</text>
</g>
<g class="message" data-from="H" data-to="H" data-label="收掉残留子 Agent 再结算" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="271.3445,752 301.3445,752 301.3445,772 271.3445,772" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="309.3445" y="762" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">收掉残留子 Agent 再结算</text>
</g>
<g class="actor" data-id="W" data-label="脚本 worker 线程" data-type="participant">
  <rect x="40" y="30" width="140.654" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="110.327" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">脚本 worker 线程</text>
</g>
<g class="actor" data-id="H" data-label="宿主侧 run" data-type="participant">
  <rect x="220.654" y="30" width="101.381" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="271.3445" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">宿主侧 run</text>
</g>
<g class="actor" data-id="S" data-label="subagent 能力缝" data-type="participant">
  <rect x="362.03499999999997" y="30" width="135.46699999999998" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="429.76849999999996" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">subagent 能力缝</text>
</g>
</svg>