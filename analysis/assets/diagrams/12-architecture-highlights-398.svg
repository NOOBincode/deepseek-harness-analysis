  <text x="501.871" y="135.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">构建期分析:提取类型</text>
</g>
<g class="node" data-id="MODEL" data-label="编译器无关的类型模型" data-shape="rectangle">
  <rect x="406.796" y="193.8" width="190.14999999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="501.871" y="212.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">编译器无关的类型模型</text>
</g>
<g class="node" data-id="ART" data-label="生成产物:运行时工件与类型声明" data-shape="rectangle">
  <rect x="375.674" y="270.70000000000005" width="252.39399999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="501.871" y="289.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">生成产物:运行时工件与类型声明</text>
</g>
<g class="node" data-id="LDR" data-label="加载器:随插件树挂载自动注册" data-shape="rectangle">
  <rect x="383.084" y="347.6" width="237.57399999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="501.871" y="366.05" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">加载器:随插件树挂载自动注册</text>
</g>
<g class="node" data-id="REG" data-label="运行期注册表:同一份调用描述符" data-shape="rectangle">
