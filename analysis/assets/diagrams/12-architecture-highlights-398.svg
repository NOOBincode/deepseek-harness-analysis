  <text x="501.871" y="442.95" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">运行期注册表:同一份调用描述符</text>
</g>
<g class="node" data-id="GW" data-label="宿主网关:解参、选接收者、调用、编码结果" data-shape="rectangle">
  <rect x="40" y="501.4" width="326.49399999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="203.24699999999999" y="519.85" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">宿主网关:解参、选接收者、调用、编码结果</text>
</g>
<g class="node" data-id="REMOTE" data-label="客户端代理:物化同名方法桩" data-shape="rectangle">
  <rect x="390.49399999999997" y="501.4" width="222.75399999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="501.871" y="519.85" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">客户端代理:物化同名方法桩</text>
</g>
<g class="node" data-id="DOC" data-label="文档与目录生成器:同一模型的下游" data-shape="rectangle">
  <rect x="637.2479999999999" y="501.4" width="267.21399999999994" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="770.8549999999999" y="519.85" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">文档与目录生成器:同一模型的下游</text>
</g>
</svg>