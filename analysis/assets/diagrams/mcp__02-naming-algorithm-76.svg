<g class="edge-label" data-from="C" data-to="D" data-label="是">
  <rect x="103.03200000000001" y="483.102" width="29.53" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="117.79700000000001" y="498.25199999999995" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">是</text>
</g>
