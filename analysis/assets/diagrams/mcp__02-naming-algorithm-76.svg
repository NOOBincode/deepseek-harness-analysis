  <text x="262.34225" y="367.40100000000007" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="262.34225" dy="-3.9000000000000012">normalized === joined</tspan><tspan x="262.34225" dy="16.900000000000002">且 len &lt;= 64 ?</tspan></text>
</g>
