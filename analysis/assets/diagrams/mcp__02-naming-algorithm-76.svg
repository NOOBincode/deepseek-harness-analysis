  <rect x="40" y="548.402" width="156.06400000000002" height="53.800000000000004" rx="0" ry="0" fill="#efe" stroke="#8a8" stroke-width="0.75" />
  <text x="118.03200000000001" y="575.302" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="118.03200000000001" dy="-3.9000000000000012">返回 normalized</tspan><tspan x="118.03200000000001" dy="16.900000000000002">(干净路径,无哈希)</tspan></text>
</g>
<g class="node" data-id="E" data-label="&quot;hash = SHA-256(serverName + '\\0' + rawName).hex[0..12" data-shape="rectangle">
  <rect x="220.06400000000002" y="548.402" width="373.17699999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="406.65250000000003" y="566.8520000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">&quot;hash = SHA-256(serverName + &#39;\\0&#39; + rawName).hex[0..12</text>
</g>
<g class="node" data-id="F" data-label="&quot;prefix = normalized[0..51" data-shape="rectangle">
  <rect x="314.54150000000004" y="625.302" width="184.22199999999995" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="406.65250000000003" y="643.7520000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">&quot;prefix = normalized[0..51</text>
</g>
<g class="node" data-id="G" data-label="返回 prefix + '_' + hash
(恒定 ≤ 64)" data-shape="rectangle">
  <rect x="319.35799999999995" y="702.202" width="174.58900000000003" height="53.800000000000004" rx="0" ry="0" fill="#ffe" stroke="#aa8" stroke-width="0.75" />
  <text x="406.6525" y="729.102" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="406.6525" dy="-3.9000000000000012">返回 prefix + &#39;_&#39; + hash</tspan><tspan x="406.6525" dy="16.900000000000002">(恒定 ≤ 64)</tspan></text>
</g>
</svg>