  <text x="262.34225" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">输入 (serverName, rawName)</text>
</g>
<g class="node" data-id="A" data-label="joined = 'mcp__' + serverName + '__' + rawName" data-shape="rectangle">
  <rect x="102.80024999999998" y="116.9" width="319.084" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="262.34225" y="135.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">joined = &#39;mcp__&#39; + serverName + &#39;__&#39; + rawName</text>
</g>
<g class="node" data-id="B" data-label="&quot;normalized = joined.replace(/[^A-Za-z0-9_-" data-shape="rectangle">
  <rect x="114.65625" y="193.8" width="295.37199999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="262.34225" y="212.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">&quot;normalized = joined.replace(/[^A-Za-z0-9_-</text>
</g>
<g class="node" data-id="C" data-label="normalized === joined
且 len &lt;= 64 ?" data-shape="diamond">
