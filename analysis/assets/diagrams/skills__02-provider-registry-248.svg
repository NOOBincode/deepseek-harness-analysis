<polyline class="edge" data-from="全量收集" data-to="返回不缓存" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="rev 变了 且 attempt = 2" points="237.86666666666667,274.1 237.86666666666667,310.1 231.64,310.1 231.64,374.40000000000003" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
