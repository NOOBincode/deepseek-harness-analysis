  <text x="237.86666666666667" y="255.65000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">全量收集</text>
</g>
<g class="node" data-id="写入缓存" data-label="写入缓存" data-shape="rounded">
