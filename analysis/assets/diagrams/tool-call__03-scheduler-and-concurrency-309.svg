<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 596.0999999999999 655" width="596.0999999999999" height="655" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="L" x1="76.615" y1="70" x2="76.615" y2="625" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="P" x1="216.615" y1="70" x2="216.615" y2="625" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="D" x1="356.615" y1="70" x2="356.615" y2="625" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="C" x1="504.66499999999996" y1="70" x2="504.66499999999996" y2="625" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="L" data-to="P" data-label="第 0 个调用过前置门" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="76.615" y1="90" x2="216.615" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="146.615" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">第 0 个调用过前置门</text>
</g>
<g class="message" data-from="P" data-to="L" data-label="放行" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="216.615" y1="130" x2="76.615" y2="130" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="146.615" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">放行</text>
</g>
<g class="message" data-from="L" data-to="D" data-label="启动第 0 个执行 并发" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="76.615" y1="170" x2="356.615" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="216.615" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">启动第 0 个执行 并发</text>
</g>
<g class="message" data-from="L" data-to="C" data-label="尝试提交 槽位还空着" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="76.615" y1="210" x2="504.66499999999996" y2="210" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="290.64" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">尝试提交 槽位还空着</text>
</g>
<g class="message" data-from="L" data-to="P" data-label="第 1 个调用过前置门 必须等前一个结束" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="76.615" y1="250" x2="216.615" y2="250" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="146.615" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">第 1 个调用过前置门 必须等前一个结束</text>
</g>
<g class="message" data-from="P" data-to="L" data-label="放行" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="216.615" y1="290" x2="76.615" y2="290" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="146.615" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">放行</text>
</g>
<g class="message" data-from="L" data-to="D" data-label="启动第 1 个执行 并发" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="76.615" y1="330" x2="356.615" y2="330" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="216.615" y="320" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">启动第 1 个执行 并发</text>
</g>
<g class="message" data-from="D" data-to="L" data-label="第 0 个执行落定" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="356.615" y1="370" x2="76.615" y2="370" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="216.615" y="360" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">第 0 个执行落定</text>
</g>
<g class="message" data-from="L" data-to="C" data-label="提交第 0 个 槽位已填" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="76.615" y1="410" x2="504.66499999999996" y2="410" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="290.64" y="400" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">提交第 0 个 槽位已填</text>
</g>
<g class="message" data-from="C" data-to="L" data-label="结果已落日志" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="504.66499999999996" y1="450" x2="76.615" y2="450" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="290.64" y="440" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">结果已落日志</text>
</g>
<g class="message" data-from="D" data-to="L" data-label="第 1 个执行落定" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="356.615" y1="490" x2="76.615" y2="490" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="216.615" y="480" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">第 1 个执行落定</text>
</g>
<g class="message" data-from="L" data-to="C" data-label="提交第 1 个" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="76.615" y1="530" x2="504.66499999999996" y2="530" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="290.64" y="520" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">提交第 1 个</text>
</g>
<g class="message" data-from="C" data-to="L" data-label="结果已落日志" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="504.66499999999996" y1="570" x2="76.615" y2="570" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="290.64" y="560" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">结果已落日志</text>
</g>
<g class="note" data-position="over" data-actors="L,D">
  <polygon points="95.97900000000001,578 331.251,578 337.251,584 337.251,601 95.97900000000001,601" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="331.251,578 337.251,584 331.251,584" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="216.615" y="589.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">前置门与提交互不重叠 只有执行可以并发</text>
</g>
<g class="actor" data-id="L" data-label="调度循环" data-type="participant">
  <rect x="30" y="30" width="93.22999999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="76.615" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">调度循环</text>
</g>
<g class="actor" data-id="P" data-label="前置门" data-type="participant">
  <rect x="176.615" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="216.615" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">前置门</text>
</g>
<g class="actor" data-id="D" data-label="并发执行" data-type="participant">
  <rect x="310" y="30" width="93.22999999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="356.615" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">并发执行</text>
</g>
<g class="actor" data-id="C" data-label="提交与落日志" data-type="participant">
  <rect x="443.22999999999996" y="30" width="122.86999999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="504.66499999999996" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">提交与落日志</text>
</g>
</svg>