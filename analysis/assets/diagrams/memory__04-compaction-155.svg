<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448.03 234.87" width="1448.03" height="234.87" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="A" data-to="B" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="141.23,117.435 181.23,117.435" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="B" data-to="C" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="326.91999999999996,117.435 366.91999999999996,117.435" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="C" data-to="D" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="497.78999999999996,117.435 537.79,117.435" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="D" data-to="E" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="否" points="666.8483333333332,91.62333333333333 891.5299999999999,91.62333333333333 891.5299999999999,86.985 957.6499999999999,86.985" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="D" data-to="F" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="是" points="666.8483333333332,143.24666666666667 720.66,143.24666666666667 720.66,147.885 794.1899999999999,147.885" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="F" data-to="G" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="910.2399999999999,147.885 957.6499999999999,147.885" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="G" data-to="H" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1073.6999999999998,147.885 1089.995,147.885 1089.995,117.435 1106.29,117.435" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="E" data-to="H" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1058.8799999999999,86.985 1089.995,86.985 1089.995,117.435 1106.29,117.435" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="H" data-to="I" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1222.34,117.435 1262.34,117.435" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="D" data-to="E" data-label="否">
  <rect x="899.5299999999999" y="70.985" width="29.53" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="914.2949999999998" y="86.135" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">否</text>
</g>
<g class="edge-label" data-from="D" data-to="F" data-label="是">
  <rect x="728.66" y="131.885" width="29.53" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="743.425" y="147.035" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">是</text>
</g>
<g class="node" data-id="A" data-label="校验区间" data-shape="rectangle">
  <rect x="40" y="98.985" width="101.22999999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="90.615" y="117.435" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">校验区间</text>
</g>
<g class="node" data-id="B" data-label="同步写开始标记" data-shape="rectangle">
  <rect x="181.23" y="98.985" width="145.69" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="254.075" y="117.435" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">同步写开始标记</text>
</g>
<g class="node" data-id="C" data-label="异步生成摘要" data-shape="rectangle">
  <rect x="366.91999999999996" y="98.985" width="130.87" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="432.35499999999996" y="117.435" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">异步生成摘要</text>
</g>
<g class="node" data-id="D" data-label="区间仍然稳定" data-shape="diamond">
  <polygon points="615.2249999999999,40 692.6599999999999,117.435 615.2249999999999,194.87 537.79,117.435" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="615.2249999999999" y="117.435" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">区间仍然稳定</text>
</g>
<g class="node" data-id="E" data-label="分类失败" data-shape="rectangle">
  <rect x="957.6499999999999" y="68.535" width="101.22999999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1008.2649999999999" y="86.985" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">分类失败</text>
</g>
<g class="node" data-id="F" data-label="写摘要记录" data-shape="rectangle">
  <rect x="794.1899999999999" y="129.435" width="116.05" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="852.2149999999999" y="147.885" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">写摘要记录</text>
</g>
<g class="node" data-id="G" data-label="写替换消息" data-shape="rectangle">
  <rect x="957.6499999999999" y="129.435" width="116.05" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1015.6749999999998" y="147.885" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">写替换消息</text>
</g>
<g class="node" data-id="H" data-label="写结束标记" data-shape="rectangle">
  <rect x="1106.29" y="98.985" width="116.05" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1164.315" y="117.435" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">写结束标记</text>
</g>
<g class="node" data-id="I" data-label="可选耐久检查点" data-shape="rectangle">
  <rect x="1262.34" y="98.985" width="145.69" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1335.185" y="117.435" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">可选耐久检查点</text>
</g>
</svg>