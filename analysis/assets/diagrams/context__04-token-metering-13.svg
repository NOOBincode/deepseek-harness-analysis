  <text x="219.92" y="212.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">本次调用报的用量够大吗</text>
</g>
<g class="node" data-id="D" data-label="以真实用量为锚点" data-shape="rectangle">
  <rect x="40" y="331" width="160.51" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="120.255" y="349.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">以真实用量为锚点</text>
</g>
<g class="node" data-id="E" data-label="以完整启发式价为锚点" data-shape="rectangle">
  <rect x="224.51" y="331" width="190.14999999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="319.585" y="349.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">以完整启发式价为锚点</text>
</g>
<g class="node" data-id="F" data-label="当前可见面按同一路由重新定价" data-shape="rectangle">
  <rect x="95.20499999999998" y="407.9" width="249.42999999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="219.91999999999996" y="426.34999999999997" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">当前可见面按同一路由重新定价</text>
</g>
<g class="node" data-id="G" data-label="算出相对锚点的有符号差值" data-shape="rectangle">
  <rect x="110.02499999999999" y="484.79999999999995" width="219.78999999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="219.91999999999996" y="503.24999999999994" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">算出相对锚点的有符号差值</text>
</g>
<g class="node" data-id="H" data-label="锚点加差值得到当前压力" data-shape="rectangle">
  <rect x="117.43499999999999" y="561.6999999999999" width="204.96999999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="219.91999999999996" y="580.15" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">锚点加差值得到当前压力</text>
</g>
<g class="node" data-id="I" data-label="投影记下采样时的可见面总量" data-shape="rectangle">
  <rect x="102.61499999999998" y="638.5999999999999" width="234.60999999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="219.91999999999996" y="657.05" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">投影记下采样时的可见面总量</text>
</g>
<g class="node" data-id="J" data-label="发布下一次请求的预计占用" data-shape="rectangle">
  <rect x="110.02499999999999" y="715.4999999999999" width="219.78999999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="219.91999999999996" y="733.9499999999999" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">发布下一次请求的预计占用</text>
</g>
