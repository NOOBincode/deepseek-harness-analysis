  <text x="284.57225" y="366.05" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">投影成一条候选快照消息</text>
</g>
<g class="node" data-id="F" data-label="前置瀑布按注册顺序包裹" data-shape="rectangle">
  <rect x="182.08725" y="424.5" width="204.96999999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="284.57225" y="442.95" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">前置瀑布按注册顺序包裹</text>
</g>
<g class="node" data-id="G" data-label="最后一个决定者说什么" data-shape="diamond">
  <polygon points="284.57224999999994,501.3999999999999 391.64724999999993,608.4749999999999 284.57224999999994,715.55 177.49724999999995,608.4749999999999" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="284.57224999999994" y="608.4749999999999" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">最后一个决定者说什么</text>
