<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712.0245 605" width="712.0245" height="605" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="M" x1="70" y1="70" x2="70" y2="575" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="TB" x1="210" y1="70" x2="210" y2="575" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="BA" x1="352.863" y1="70" x2="352.863" y2="575" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="AP" x1="502.0245" y1="70" x2="502.0245" y2="575" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="U" x1="642.0245" y1="70" x2="642.0245" y2="575" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="M" data-to="TB" data-label="bash(command)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="90" x2="210" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="140" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">bash(command)</text>
</g>
<g class="message" data-from="TB" data-to="BA" data-label="run(spec with sandboxPolicy)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="130" x2="352.863" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="281.4315" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">run(spec with sandboxPolicy)</text>
</g>
<g class="message" data-from="BA" data-to="TB" data-label="{ sandbox: { denied: true, mode: read-only } }" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="352.863" y1="170" x2="210" y2="170" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="281.4315" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">{ sandbox: { denied: true, mode: read-only } }</text>
</g>
<g class="message" data-from="TB" data-to="M" data-label="输出 + 拒绝标记 + 升级提示" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="210" x2="70" y2="210" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="140" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">输出 + 拒绝标记 + 升级提示</text>
</g>
<g class="message" data-from="M" data-to="TB" data-label="bash(同一 command + sandbox_permissions + justification)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="250" x2="210" y2="250" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="140" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">bash(同一 command + sandbox_permissions + justification)</text>
</g>
<g class="message" data-from="TB" data-to="TB" data-label="validateEscalationArgs ✓ → 严格更宽 ✓" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="210,290 240,290 240,310 210,310" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="248" y="300" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">validateEscalationArgs ✓ → 严格更宽 ✓</text>
</g>
<g class="message" data-from="TB" data-to="AP" data-label="request({ agent, toolName: 'bash', callId, reason: 'escalate sandbox to workspace-write: …' })" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="360" x2="502.0245" y2="360" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="356.01225" y="350" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">request({ agent, toolName: &#39;bash&#39;, callId, reason: &#39;escalate sandbox to workspace-write: …&#39; })</text>
</g>
<g class="message" data-from="AP" data-to="U" data-label="审批弹窗" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="502.0245" y1="400" x2="642.0245" y2="400" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="572.0245" y="390" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">审批弹窗</text>
</g>
<g class="message" data-from="U" data-to="AP" data-label="allowed-once" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="642.0245" y1="440" x2="502.0245" y2="440" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="572.0245" y="430" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">allowed-once</text>
</g>
<g class="message" data-from="AP" data-to="TB" data-label="'allowed-once'" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="502.0245" y1="480" x2="210" y2="480" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="356.01225" y="470" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">&#39;allowed-once&#39;</text>
</g>
<g class="message" data-from="TB" data-to="BA" data-label="run(spec with { ...policy, mode: 'workspace-write' })" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="520" x2="352.863" y2="520" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="281.4315" y="510" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">run(spec with { ...policy, mode: &#39;workspace-write&#39; })</text>
</g>
<g class="note" data-position="over" data-actors="TB,BA">
  <polygon points="111.79050000000004,528 445.0725,528 451.0725,534 451.0725,551 111.79050000000004,551" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="445.0725,528 451.0725,534 445.0725,534" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="281.4315" y="539.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">只有这一次调用带更宽 mode；会话的 sandbox/mode 未被改写</text>
</g>
<g class="actor" data-id="M" data-label="模型" data-type="participant">
  <rect x="30" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="70" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">模型</text>
</g>
<g class="actor" data-id="TB" data-label="bash 工具" data-type="participant">
  <rect x="162.2735" y="30" width="95.453" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="210" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">bash 工具</text>
</g>
<g class="actor" data-id="BA" data-label="bash 执行器" data-type="participant">
  <rect x="297.7265" y="30" width="110.273" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="352.863" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">bash 执行器</text>
</g>
<g class="actor" data-id="AP" data-label="ctx.approval" data-type="participant">
  <rect x="447.9995" y="30" width="108.05" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="502.0245" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">ctx.approval</text>
</g>
<g class="actor" data-id="U" data-label="用户" data-type="participant">
  <rect x="602.0245" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="642.0245" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">用户</text>
</g>
</svg>