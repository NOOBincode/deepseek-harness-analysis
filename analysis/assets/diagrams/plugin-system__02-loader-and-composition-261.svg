  <rect x="295.12799999999993" y="30" width="190.301" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="390.27849999999995" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Hmr.registerConfig hmr:134</text>
</g>
<g class="actor" data-id="R" data-label="refreshConfig hmr:297" data-type="participant">
  <rect x="525.429" y="30" width="165.107" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="607.9825" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">refreshConfig hmr:297</text>
</g>
<g class="actor" data-id="E" data-label="Entry.update entry:142" data-type="participant">
  <rect x="730.536" y="30" width="163.625" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="812.3485" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Entry.update entry:142</text>
</g>
</svg>