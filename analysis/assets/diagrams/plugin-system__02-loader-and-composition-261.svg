<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1208.3824999999997 475" width="1208.3824999999997" height="475" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="W" x1="142.56399999999996" y1="70" x2="142.56399999999996" y2="445" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="H" x1="390.27849999999995" y1="70" x2="390.27849999999995" y2="445" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="R" x1="607.9825" y1="70" x2="607.9825" y2="445" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="E" x1="812.3485" y1="70" x2="812.3485" y2="445" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="W" data-to="H" data-label="registerConfig(filename, refresh)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="142.56399999999996" y1="90" x2="390.27849999999995" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="266.42125" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">registerConfig(filename, refresh)</text>
</g>
<g class="message" data-from="H" data-to="H" data-label="findWatchRoot → watch(root,{depth,ignoreInitial:false})" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="390.27849999999995,130 420.27849999999995,130 420.27849999999995,150 390.27849999999995,150" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="428.27849999999995" y="140" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">findWatchRoot → watch(root,{depth,ignoreInitial:false})</text>
</g>
<g class="message" data-from="H" data-to="W" data-label="effect disposer" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="390.27849999999995" y1="200" x2="142.56399999999996" y2="200" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="266.42125" y="190" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">effect disposer</text>
</g>
<g class="message" data-from="H" data-to="R" data-label="文件 add/change/unlink(exact path)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="390.27849999999995" y1="240" x2="607.9825" y2="240" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="499.1305" y="230" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">文件 add/change/unlink(exact path)</text>
</g>
<g class="message" data-from="R" data-to="W" data-label="refresh()" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="607.9825" y1="280" x2="142.56399999999996" y2="280" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="375.27324999999996" y="270" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">refresh()</text>
</g>
<g class="message" data-from="W" data-to="E" data-label="重读两个用户层 + composeLive() → entry.update({config:{...includeConfig,patches}})" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="142.56399999999996" y1="320" x2="812.3485" y2="320" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="477.45624999999995" y="310" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">重读两个用户层 + composeLive() → entry.update({config:{...includeConfig,patches}})</text>
</g>
<g class="message" data-from="E" data-to="E" data-label="diff=['config'] → 分支 C(不重挂)→ _patchContext → 逐条 create/update" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="812.3485,360 842.3485,360 842.3485,380 812.3485,380" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="850.3485" y="370" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">diff=[&#39;config&#39;] → 分支 C(不重挂)→ _patchContext → 逐条 create/update</text>
</g>
<g class="note" data-position="over" data-actors="R">
  <polygon points="463.8835,398 746.0815,398 752.0815,404 752.0815,421 463.8835,421" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="746.0815,398 752.0815,404 746.0815,404" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="607.9825" y="409.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">refresh 抛错 → warn + parallel(&#39;hmr/config-update-failed&#39;)</text>
</g>
<g class="actor" data-id="W" data-label="watchUserPatches app-boot:250" data-type="participant">
  <rect x="29.999999999999986" y="30" width="225.12799999999996" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="142.56399999999996" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">watchUserPatches app-boot:250</text>
</g>
